[project]
name = "citedesk"
version = "0.1.0"
description = "CiteDesk: handbook question answering where every sentence cites its source passage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "openai>=1.50,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
# Local embedding model and cross-encoder (ONNX). Free, no API key; downloads model files on first use.
models = ["fastembed>=0.4,<1"]

[project.scripts]
citedesk = "citedesk.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citedesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
# Test data (long sentences and quotes) reads better on one line.
"tests/**" = ["E501"]

[tool.mypy]
strict = true
files = ["src/citedesk"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=citedesk --cov-report=term-missing"
markers = [
    "models: needs the local ONNX models (uv sync --extra models)",
    "integration: needs a running Postgres (see tests/integration)",
    "llm: calls the real OpenAI model, costs a few cents (see tests/llm)",
]
